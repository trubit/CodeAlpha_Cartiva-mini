version: '3.8'

services:
  # ============================================================================
  # MongoDB Database Service
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: cartiva-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: cartiva-mini
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cartiva-network

  # ============================================================================
  # Backend API Gateway Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cartiva-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/cartiva-mini
      FRONTEND_URL: http://localhost:5180
      JWT_SECRET: ${JWT_SECRET:-cartiva-mini-production-jwt-secret-replace-in-env-32chars}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-cartiva-mini-production-refresh-secret-replace-in-env}
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_placeholder}
      PAYSTACK_BASE_URL: https://api.paystack.co
      UPLOAD_DIR: uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cartiva-network

  # ============================================================================
  # Frontend Client SPA (Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cartiva-frontend
    restart: unless-stopped
    ports:
      - '5180:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cartiva-network

volumes:
  mongo-data:
    driver: local
  uploads-data:
    driver: local

networks:
  cartiva-network:
    driver: bridge

