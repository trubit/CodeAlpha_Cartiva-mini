apiVersion: v1
kind: ConfigMap
metadata:
  name: cartiva-config
  namespace: cartiva-mini
  labels:
    app.kubernetes.io/name: cartiva-mini
data:
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_URL: "https://cartivamini.ng"
  PAYSTACK_BASE_URL: "https://api.paystack.co"
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
  MONGODB_URI: "mongodb://mongodb-service.cartiva-mini.svc.cluster.local:27017/cartiva-mini"
  UPLOAD_DIR: "uploads"

