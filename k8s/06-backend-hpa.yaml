apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cartiva-backend-hpa
  namespace: cartiva-mini
  labels:
    app.kubernetes.io/name: cartiva-mini
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cartiva-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

