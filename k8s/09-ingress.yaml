apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cartiva-ingress
  namespace: cartiva-mini
  labels:
    app.kubernetes.io/name: cartiva-mini
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cartivamini.ng
        - www.cartivamini.ng
        - api.cartivamini.ng
      secretName: cartivamini-tls-cert
  rules:
    - host: cartivamini.ng
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: cartiva-backend-service
                port:
                  number: 5000
          - path: /uploads/
            pathType: Prefix
            backend:
              service:
                name: cartiva-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cartiva-frontend-service
                port:
                  number: 80
    - host: api.cartivamini.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cartiva-backend-service
                port:
                  number: 5000

