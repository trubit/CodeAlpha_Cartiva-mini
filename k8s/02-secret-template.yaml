# Secret template for reference (Populate using SealedSecrets, Vault, or base64 encoded strings during deployment)
apiVersion: v1
kind: Secret
metadata:
  name: cartiva-secrets
  namespace: cartiva-mini
  labels:
    app.kubernetes.io/name: cartiva-mini
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_PRODUCTION_JWT_SECRET_MIN_32_CHARS"
  REFRESH_TOKEN_SECRET: "REPLACE_WITH_PRODUCTION_REFRESH_TOKEN_SECRET"
  PAYSTACK_SECRET_KEY: "sk_live_replace_with_merchant_live_key"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASS: "REPLACE_WITH_SENDGRID_KEY"
  FROM_EMAIL: "noreply@cartivamini.ng"

